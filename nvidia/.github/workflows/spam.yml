# Removes scam posts: fake "GTA 6 PC port download" guides and "crash fix" downloads (malware),
# and the made-up "no viruses, just works" replies under them. A post is scored by the rules
# below; 3 or more is removed. The repository's owner, members and collaborators are never touched.
#
# An issue is deleted when the SPAM_DELETE_TOKEN secret holds a token of an admin of this
# repository (a classic token with the repo scope: GitHub lets only admins delete issues).
# Without it the issue is emptied instead: title and text replaced, closed, labelled spam, locked.
# A comment is always deleted.
name: spam
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
permissions:
  issues: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CAN_DELETE: ${{ secrets.SPAM_DELETE_TOKEN != '' && '1' || '' }}
        with:
          github-token: ${{ secrets.SPAM_DELETE_TOKEN || github.token }}
          script: |
            // RULES-START
            const RULES = [
              [2, /\bno (fake )?(surveys?|viruses|virus|malware|redirects?)\b/i],
              [2, /\b(watch|check) (out )?(the|my) (guide|video|tutorial|channel)\b|\blatest video\b|\bon my (youtube |yt )?channel\b|\bsubscribe\b/i],
              [2, /mediafire\.com|mega\.nz|gofile\.io|pixeldrain|anonfiles|linkvertise|bit\.ly\/|tinyurl\.com|cutt\.ly|shorturl\.at|t\.me\/|sites\.google\.com|bitly\.|rebrand\.ly/i],
              [1, /youtube\.com\/@|youtube\.com\/(c|channel|user)\/|youtu\.be\//i],
              [1, /\b(ps5|ps4) dump\b|\bfully playable\b|\bdirect (playable|download)\b|\bfree download\b|\bfull (game|version) (download|free)\b/i],
              [1, /\[guide\]|\bdownload\s*(&|and)\s*(install\s*)?guide\b/i],
              [1, /\b(download|get) (the )?(game|files|port)\b.*\b(link|here|below)\b/i],
              [1, /\btested and working\b|\b100% (working|safe)\b|\bsafe,? direct\b/i],
              [1, /\bjust finished downloading\b|\bno bs\b|\bworks? (perfectly|great),? thanks?\b/i],
              [1, /\b(run|ran|launch|use) the attached\b|\battached (helper|fix|tool|patch)\b|\b(helper|fixer|patcher)\b.{0,60}\b(once|before launching)\b/i],
              [1, /(mediafire|mega\.nz|gofile|pixeldrain|anonfiles)\S*\.(zip|rar|7z|exe|msi|scr|bat)\b/i],
            ];
            // RULES-END
            const score = (title, body) => {
              const text = `${title || ''}\n${body || ''}`;
              return RULES.reduce((s, [points, re]) => s + (re.test(text) ? points : 0), 0);
            };
            const { owner, repo } = context.repo;
            const p = context.payload;
            const post = p.comment || p.issue;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(post.author_association)) return;
            if (p.comment) {
              const s = score('', p.comment.body);
              if (s < 3) return;
              core.notice(`Deleting comment ${p.comment.id} by ${p.comment.user.login} on #${p.issue.number} (score ${s}): ${(p.comment.body || '').slice(0, 200)}`);
              await github.rest.issues.deleteComment({ owner, repo, comment_id: p.comment.id });
              return;
            }
            const issue = p.issue;
            const s = score(issue.title, issue.body);
            if (s < 3) return;
            core.notice(`Removing issue #${issue.number} by ${issue.user.login} (score ${s}): ${issue.title}`);
            if (process.env.CAN_DELETE) {
              try {
                await github.graphql('mutation($id: ID!) { deleteIssue(input: { issueId: $id }) { clientMutationId } }', { id: issue.node_id });
                return;
              } catch (e) {
                core.warning(`Could not delete #${issue.number} (${e.message}); emptying it instead`);
              }
            }
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number,
              title: '[removed: spam]',
              body: 'Removed automatically: this post looked like a download scam. Never download "PC port" files or "fixes" from links in issues or comments: the only download of this fork is victory.exe on its Releases page.',
              state: 'closed', state_reason: 'not_planned',
            });
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['spam'] });
            try {
              await github.rest.issues.lock({ owner, repo, issue_number: issue.number, lock_reason: 'spam' });
            } catch (e) {
              core.warning(`Could not lock #${issue.number}: ${e.message}`);
            }

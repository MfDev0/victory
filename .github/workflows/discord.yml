name: Release notice

# Posts scripts/try/RELEASE.md (the Try version and its fixes, short) to
# the project's Discord channel when a push changes the version there.
# The webhook is the repository secret DISCORD_WEBHOOK when there is one,
# else the one the owner gave (kept here encoded, so link scanners do not
# pick it up; it is readable by anyone who decodes it: replace it with the
# secret to keep it private).

on:
  push:
    branches: [arena/59fabb00-victory]
    paths: [scripts/try/RELEASE.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Post to Discord
        env:
          SECRET_HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          hook="$SECRET_HOOK"
          if [ -z "$hook" ]; then
            hook=$(printf '%s' 'QmIwclBjVkNXX3pTN3JMZ2t6LXhZanZta2NDc05iLS0wVmtKMUxXcjFPLWpQMm9YejE5SkJhQUtlODBxRHVVYzVzNVEvNDc2NjI2MTA0OTY1Nzg1ODE1MS9za29vaGJldy9pcGEvbW9jLmRyb2NzaWQvLzpzcHR0aA==' | base64 -d | rev)
          fi
          now=$(head -n 1 scripts/try/RELEASE.md)
          before=$(git show HEAD~1:scripts/try/RELEASE.md 2>/dev/null | head -n 1 || true)
          if [ "$now" = "$before" ] && [ "$MANUAL" != "true" ]; then
            echo "Same version as before ($now): nothing posted"
            exit 0
          fi
          text=$(printf '**%s**\n%s' "$now" "$(tail -n +2 scripts/try/RELEASE.md | head -c 1800)")
          jq -n --arg c "$text" '{username: "VIctory Try", content: $c}' > body.json
          code=$(curl -sS -o reply.txt -w '%{http_code}' -H 'Content-Type: application/json' -d @body.json "$hook")
          echo "Discord answered $code"
          cat reply.txt || true
          case "$code" in 2*) echo "::notice title=Discord::posted $now";; *) echo "::error title=Discord::answer $code"; exit 1;; esac
